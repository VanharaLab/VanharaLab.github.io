name: Update ORCID publications

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests pyyaml

      - name: Fetch ORCID publications
        run: |
          python scripts/fetch_orcid.py

      - name: Verify generated publications
        run: |
          echo "Generated publications:"
          cat _data/publications.yml
          echo ""
          echo "Git status:"
          git status

      - name: Commit updated publications
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add _data/publications.yml

          git diff --cached --quiet && exit 0

          git commit -m "Update ORCID publications"

          git push
